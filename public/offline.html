<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline | Sulaiman Al Fauzan</title>
<link rel="icon" type="image/jpeg" href="/logo.jpeg">
<meta name="theme-color" content="#15803d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --border: #dce6df;
  --text: #13261a;
  --text2: #3f5a48;
  --text3: #6b8173;
  --accent: #15803d;
  --accent-h: #166534;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1610;
    --surface: #15241b;
    --border: #2a4033;
    --text: #eef6f0;
    --text2: #b7c9bc;
    --text3: #87a090;
    --accent: #4ade80;
    --accent-h: #22c55e;
  }
}
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2.25rem 2rem;
  max-width: 440px;
  width: 100%;
  text-align: center;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
}
.icon-wrap {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(21, 128, 61, 0.12);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
}
.icon-wrap svg {
  width: 36px;
  height: 36px;
}
h1 {
  font-size: 1.35rem;
  font-weight: 700;
  margin: 0 0 0.5rem;
  color: var(--text);
}
p {
  font-size: 0.925rem;
  color: var(--text2);
  line-height: 1.55;
  margin: 0 0 1.75rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 0.85rem 1.25rem;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  text-decoration: none;
}
.btn:hover {
  opacity: 0.92;
}
.btn:active {
  transform: scale(0.98);
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text3);
  margin-top: 1.25rem;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.04);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #f59e0b;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon-wrap">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m2.828 6.364l2.829-2.829M3 3l18 18M9.879 9.879a3 3 0 004.242 4.242" />
    </svg>
  </div>
  <h1>Tidak Ada Koneksi Internet</h1>
  <p>Halaman ini belum tersedia secara offline. Pastikan perangkat Anda terhubung ke internet lalu coba lagi.</p>
  <button class="btn" onclick="location.reload()">
    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
    </svg>
    Muat Ulang
  </button>
  <div class="status-pill">
    <span class="status-dot" id="dot"></span>
    <span id="statusText">Mode Offline</span>
  </div>
</div>
<script>
window.addEventListener('online', () => {
  document.getElementById('dot').style.background = '#22c55e';
  document.getElementById('statusText').textContent = 'Koneksi kembali! Memuat...';
  setTimeout(() => location.reload(), 800);
});
</script>
</body>
</html>
